<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What in the Tax? — Where did your property-tax dollars go?</title>
    <meta
      name="description"
      content="What in the Tax? helps residents explore a sample property-tax bill and the public records behind each supported figure. Independent preview; not tax advice."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="no-referrer" />
    <!-- noindex is publication policy, not an oversight: every pack is a draft
         and PUBLISH.md blocks indexing until the seal gates pass. A test pins
         this tag and the matching X-Robots-Tag header so no refactor can drop
         them silently. Open Graph tags below are independent of indexing -
         they shape how a deliberately shared link renders, which is wanted
         even while search engines are asked to stay out. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:site_name" content="What in the Tax?" />
    <meta property="og:title" content="What in the Tax? — Where did your property-tax dollars go?" />
    <meta
      property="og:description"
      content="Ontario property taxes traced to reviewed public sources: who levied it and what it was spent on, for every taxing municipality with a usable provincial filing. Independent draft preview; not tax advice."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://whatinthetax.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="What in the Tax? — Where did your property-tax dollars go?" />
    <meta
      name="twitter:description"
      content="Ontario property taxes traced to reviewed public sources. Independent draft preview; not tax advice."
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script>
      // Light is the default; the OS colour scheme is deliberately not consulted.
      // Runs before first paint so a reader who chose dark never sees a white flash.
      try {
        if (localStorage.getItem('whatinthetax.theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.querySelector('meta[name="theme-color"]').content = '#0b1420'
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
