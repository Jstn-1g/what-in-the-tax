name: National rollout readiness

'on':
  # Run on every pull request so this workflow can safely be a required check.
  pull_request: {}
  push:
    paths:
      - "national/**"
      - "scripts/build_national_registry.py"
      - "scripts/build_sgc_geography_index.py"
      - "scripts/manage_national_rollout.py"
      - "scripts/validate_regional_registry.py"
      - "tests/test_national_*.py"
      - "tests/regional_registry_test.py"
      - "docs/PROVINCIAL-ROLLOUT.md"
      - "CONTRIBUTING.md"
      - "requirements.txt"
      - ".github/workflows/national-readiness.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: national-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: -r requirements.txt

      - name: Run national unit and schema tests
        run: python -m unittest discover -s tests -p "test_national_*.py"

      - name: Check all jurisdiction rollout manifests
        run: python scripts/manage_national_rollout.py check

      - name: Print machine-readable rollout status
        run: python scripts/manage_national_rollout.py status --format json

      - name: Validate the checked-in regional mapping pilot
        run: python scripts/validate_regional_registry.py

      - name: Verify readiness checks are observational
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git status --short
            echo "Readiness checks created or changed repository files." >&2
            exit 1
          fi
