name: Validate Cloudflare release

'on':
  push: {}
  workflow_dispatch:

# Start every job with no repository or deployment privileges. Each job receives
# only the permissions it needs below.
permissions: {}

concurrency:
  group: cloudflare-release-validation
  cancel-in-progress: true

jobs:
  verify-and-build:
    # workflow_dispatch can be launched from another branch in the GitHub UI.
    # Never let that selection become a production deployment.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the selected default-branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: -r requirements.txt

      - name: Run deterministic data, geography, and pack gates
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover -s tests -p "*test*.py"
          python scripts/validate_regional_registry.py
          python scripts/build_public_packs.py --check

          for pack in corpus/*/pack.yaml; do
            slug="${pack#corpus/}"
            slug="${slug%/pack.yaml}"
            case "$slug" in
              _*) continue ;;
            esac
            python scripts/validate_pack.py "$slug" --no-write
          done

          # Validation must remain observational. A future gate that changes a
          # tracked artifact is a release failure, even if its assertions pass.
          git diff --exit-code -- .

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies without lifecycle scripts
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test and build Cloudflare artifact
        working-directory: web
        run: |
          npm test -- --run
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify Cloudflare preview safeguards
        shell: bash
        run: |
          set -euo pipefail
          # Retain HTML-level safeguards even if response headers are stripped
          # by an intermediary or the artifact is opened outside Cloudflare.
          grep -Fq 'name="robots" content="noindex, nofollow"' web/dist/index.html
          grep -Fq 'name="referrer" content="no-referrer"' web/dist/index.html

          # Cloudflare Workers Static Assets applies these response headers.
          test -f web/dist/_headers
          grep -Fq "Content-Security-Policy:" web/dist/_headers
          grep -Fq "X-Robots-Tag: noindex, nofollow" web/dist/_headers
