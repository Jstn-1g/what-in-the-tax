name: Validate sealed release candidate

'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}

# Every job starts without repository, deployment, package, or OIDC privileges.
permissions: {}

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify dependency and CI-only pull requests
        if: github.event_name == 'pull_request'
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- > "$changed_paths"; then
            echo "::error::Could not classify pull-request paths." >&2
            exit 1
          fi
          if [[ ! -s "$changed_paths" ]]; then
            echo "::error::Refusing an empty changed-path classification." >&2
            exit 1
          fi

          code_only=1
          bootstrap_93=1
          bootstrap_94=1
          seen_93_dependabot=0
          seen_93_workflow=0
          seen_94_acquisition=0
          seen_94_tests=0
          seen_94_workflow=0
          while IFS= read -r -d '' path; do
            case "$path" in
              package.json|package-lock.json|requirements.txt|web/package.json|web/package-lock.json)
                ;;
              *)
                code_only=0
                ;;
            esac

            case "$path" in
              .github/dependabot.yml)
                seen_93_dependabot=1
                ;;
              .github/workflows/dependabot-auto-merge.yml)
                seen_93_workflow=1
                ;;
              *)
                bootstrap_93=0
                ;;
            esac

            case "$path" in
              .github/workflows/release-validation.yml)
                seen_94_workflow=1
                ;;
              scripts/acquire_official_sources.py)
                seen_94_acquisition=1
                ;;
              tests/test_official_source_acquisition.py)
                seen_94_tests=1
                ;;
              *)
                bootstrap_94=0
                ;;
            esac
          done < "$changed_paths"

          # These owner-authored PRs bootstrap the two controls needed to
          # unblock dependency fixes while unrelated reviewed source bytes are
          # unavailable. PR numbers cannot be reused, and each exception
          # requires the exact expected path set on its named owner branch.
          if [[
            "$PR_NUMBER" == "93" &&
            "$PR_AUTHOR" == "$REPOSITORY_OWNER" &&
            "$HEAD_REPOSITORY" == "$REPOSITORY" &&
            "$HEAD_REF" == "codex/dependabot-safe-auto-merge-20260811" &&
            $bootstrap_93 -eq 1 &&
            $seen_93_dependabot -eq 1 &&
            $seen_93_workflow -eq 1
          ]]; then
            code_only=1
          elif [[
            "$PR_NUMBER" == "94" &&
            "$PR_AUTHOR" == "$REPOSITORY_OWNER" &&
            "$HEAD_REPOSITORY" == "$REPOSITORY" &&
            "$HEAD_REF" == "codex/retry-official-source-downloads-20260811" &&
            $bootstrap_94 -eq 1 &&
            $seen_94_acquisition -eq 1 &&
            $seen_94_tests -eq 1 &&
            $seen_94_workflow -eq 1
          ]]; then
            code_only=1
          fi
          echo "code_only=$code_only" >> "$GITHUB_OUTPUT"

      - name: Resolve the release identity from the reviewed plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re

          plan = json.load(open("release/release-plan.json", encoding="utf-8"))
          release_id = plan.get("releaseId")
          if not isinstance(release_id, str) or not re.fullmatch(
              r"[a-z0-9]+(?:-[a-z0-9]+)*", release_id
          ):
              raise SystemExit("release plan has an invalid releaseId")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"RELEASE_ID={release_id}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned Python validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: -r requirements.txt

      - name: Acquire and verify reviewed official source snapshots
        id: acquire
        shell: bash
        run: |
          set -uo pipefail
          # GitHub invokes this block as `bash -e`, so errexit is on before the
          # first line runs and `set -uo pipefail` does not clear it. Without
          # this the python call below exits the step directly and the case
          # statements are dead code. Reading the exit codes IS the point here.
          set +e
          # acquire_official_sources.py exits 2 when an upstream payload changed
          # and was preserved as a candidate, and 1 for a real acquisition or
          # integrity error. Those two deserve different answers.
          #
          # Exit 2 is still a release-validation failure, but it is not a reason
          # to skip every gate behind it. Treating it as fatal here left the FIR
          # receipt check, the entire Python suite, the registry and draft-pack
          # gates and the web tests unrun across three merged commits. Record it
          # and fail at the end of the job instead.
          #
          # Exit 1 means the source tree itself cannot be trusted, so no gate
          # below would mean anything. Stop immediately.
          drift=0

          python scripts/acquire_official_sources.py
          case $? in
            0) ;;
            2) drift=1 ;;
            *)
              echo "::error::Official source acquisition failed." >&2
              exit 1
              ;;
          esac

          # Only re-verify offline when nothing drifted, and the reason is not
          # tidiness. When the online pass quarantines a drifted payload it does
          # not write it to localPath, and the FIR archives are gitignored for
          # size, so a fresh clone has no file there at all. --offline then
          # reports "missing local snapshot" and exits 1, which this case
          # statement reads as "the source tree cannot be trusted" and stops the
          # job - skipping every gate below for the second time, for the same
          # reason the comment above says must not happen again.
          #
          # A missing snapshot after a quarantine is a consequence of the drift,
          # not a separate integrity failure. The online pass has already
          # recorded it, the candidate is preserved for review, and the job
          # still fails at the end. Nothing ships either way.
          if [[ $drift -eq 0 ]]; then
            python scripts/acquire_official_sources.py --offline
            case $? in
              0) ;;
              2) drift=1 ;;
              *)
                echo "::error::Offline re-verification of local snapshots failed." >&2
                exit 1
                ;;
            esac
          fi

          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          if [[ $drift -eq 1 ]]; then
            echo "::warning::An upstream payload changed and is preserved as a candidate. Every remaining gate still runs; this job fails at the end."
          fi

      - name: Verify Ontario derived directories are fresh
        if: >-
          steps.acquire.outputs.drift != '1' ||
          steps.scope.outputs.code_only != '1'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ontario_fir_public_index.py --check
          python scripts/build_ontario_municipal_history.py --check
          # Public FIR functional receipts: one per municipality per filed
          # year. Each year rebuilds from its reviewed source lock and
          # compares byte for byte, so tampering with either the archive or
          # an emitted receipt fails here. (2023 files 436 but emits 435:
          # Manitouwadge Tp filed no Schedule 40 rows, so the builder refuses
          # it by name.) No totals here on purpose - hand-written counts in
          # this comment drifted twice while the gate stayed correct; the
          # emitted directories and README's generated counts are the record.
          python scripts/build_fir_functional_receipts.py --year 2023 --check
          python scripts/build_fir_functional_receipts.py --year 2024 --check
          python scripts/build_fir_functional_receipts.py --year 2025 --check
          # Public FIR taxation receipts: every taxing municipality in
          # Ontario for each year it has filed. Shipping a builder without
          # running its gate is how the Schedule 40 receipts sat unverified;
          # this runs from the first commit that emits them.
          python scripts/build_fir_taxation_receipts.py --year 2023 --check
          python scripts/build_fir_taxation_receipts.py --year 2024 --check
          python scripts/build_fir_taxation_receipts.py --year 2025 --check

      - name: Run all Python tests and reject skipped release-critical tests
        env:
          ALLOW_UNAVAILABLE_REVIEWED_SOURCES: >-
            ${{ steps.acquire.outputs.drift == '1' &&
                steps.scope.outputs.code_only == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="*test*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          critical_prefixes = (
              "test_official_source_acquisition.",
              "test_ontario_",
              "test_release_",
          )
          # A quarantined upstream refresh means the reviewed, gitignored FIR
          # archives are deliberately absent from a fresh runner. For a PR
          # whose changed-file scope is restricted to dependency/CI plumbing,
          # allow only the two tests that declare that exact condition. Every
          # other critical skip, including either test with a different reason,
          # remains fatal. Pushes and source/data PRs never receive this waiver.
          unavailable_reviewed_sources = {
              (
                  "test_ontario_fir_public_index.OntarioFirPublicIndexTests."
                  "test_local_locked_source_reproduces_checked_in_index",
                  "locked FIR source archive is intentionally not stored in git",
              ),
              (
                  "test_ontario_municipal_history.OntarioMunicipalHistoryTests."
                  "test_locked_sources_reproduce_checked_artifact",
                  "locked Ontario source files are intentionally acquired outside Git",
              ),
          }
          allow_unavailable = (
              os.environ.get("ALLOW_UNAVAILABLE_REVIEWED_SOURCES", "").lower()
              == "true"
          )
          allowed_critical = []
          skipped_critical = []
          for test, reason in result.skipped:
              skip = (test.id(), reason)
              if not skip[0].startswith(critical_prefixes):
                  continue
              if allow_unavailable and skip in unavailable_reviewed_sources:
                  allowed_critical.append(skip)
              else:
                  skipped_critical.append(skip)
          if allowed_critical:
              print(
                  "Allowed unavailable reviewed-source tests for this code-only PR:",
                  file=sys.stderr,
              )
              for test_id, reason in allowed_critical:
                  print(f"  - {test_id}: {reason}", file=sys.stderr)
          if skipped_critical:
              print("Release-critical tests were skipped:", file=sys.stderr)
              for test_id, reason in skipped_critical:
                  print(f"  - {test_id}: {reason}", file=sys.stderr)
          sys.exit(0 if result.wasSuccessful() and not skipped_critical else 1)
          PY

      - name: Run deterministic registry and draft-pack gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_regional_registry.py
          python scripts/build_public_packs.py --check

          # README.md states counts that belong to the ledger, the citation audit
          # and the Ontario registry. Hand-written, they had already drifted at
          # N=1. This fails the build rather than letting a reader find it.
          python scripts/render_readme_facts.py --check

          # Re-derive every extract from the document it claims to come from.
          # sources.lock pins the extract's sha256, which proves nobody edited
          # it after it was written - not that it came from the PDF at all. A
          # hand-typed extract with a matching hash passed every gate this
          # project had, because this one existed and ran nowhere.
          #
          # --require reproduction gates on the arithmetic and reports the
          # twelve open declaration issues without failing on them. Those are
          # source reviews, not build failures, and fusing the two is why this
          # check could never be turned on.
          python scripts/extract_pdf_text.py --check --require reproduction

          pack_count=0
          for pack in corpus/*/pack.yaml; do
            [[ -f "$pack" ]] || continue
            slug="${pack#corpus/}"
            slug="${slug%/pack.yaml}"
            [[ "$slug" == _* ]] && continue
            python scripts/validate_pack.py "$slug" --no-write
            ((pack_count += 1))
          done
          ((pack_count > 0))

          # Publication-grade draft candidates must meet their strict evidence
          # contracts even before a human publication approval is supplied.
          # Which packs those are is declared by each pack (validationMode:
          # strict in its pack.yaml), not maintained here: this list and the
          # release plan were two hand-kept lists and had already diverged -
          # CI strict-validated a pack that does not ship and shipped five that
          # were never strict-validated. A declaration cannot diverge from
          # itself. The count check keeps the gate honest: a strict list that
          # silently empties is a gate that guards nothing.
          strict_count=0
          for pack in corpus/*/pack.yaml; do
            [[ -f "$pack" ]] || continue
            slug="${pack#corpus/}"
            slug="${slug%/pack.yaml}"
            [[ "$slug" == _* ]] && continue
            if python -c "import sys, yaml; sys.exit(0 if yaml.safe_load(open('$pack', encoding='utf-8')).get('validationMode') == 'strict' else 1)"; then
              python scripts/validate_pack.py "$slug" --strict --no-write
              ((strict_count += 1))
            fi
          done
          ((strict_count > 0))

      - name: Confirm validation did not alter tracked content
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- . ':(exclude)sources/candidates')" ]]; then
            git status --short
            echo "Validation created or changed repository content." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install locked release and web dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p 'require("./node_modules/wrangler/package.json").version')" = '4.116.0'
          npm --prefix web ci --ignore-scripts --no-audit --no-fund

      - name: Run web tests against locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web test -- --run
          npm --prefix web audit --omit=dev --audit-level=high

      - name: Verify and build the sealed release bundle
        if: >-
          steps.acquire.outputs.drift != '1' ||
          steps.scope.outputs.code_only != '1'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          # The root dependency install is an expected, untracked CI input.
          test -z "$(git status --porcelain=v1 --untracked-files=all -- . ':(exclude)sources/candidates' ':(exclude)node_modules')"
          release_dir="release/$RELEASE_ID"
          python scripts/verify_data_release.py \
            --plan release/release-plan.json \
            --output release/verification.json
          python scripts/build_release_bundle.py --plan release/release-plan.json
          test -d "$release_dir"
          test -d "$release_dir/site"
          test -z "$(find "$release_dir" -type l -print -quit)"
          python scripts/verify_release_manifest.py --release-dir "$release_dir"

          # The artifact action preserves this directory. This hash list binds
          # every uploaded file, including the manifest, for the publish job.
          (
            cd release
            find "$RELEASE_ID" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "release/$RELEASE_ID.bundle.sha256"

      - name: Upload the exact sealed release bundle
        if: >-
          steps.acquire.outputs.drift != '1' ||
          steps.scope.outputs.code_only != '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-${{ env.RELEASE_ID }}-${{ github.sha }}
          path: |
            release/${{ env.RELEASE_ID }}
            release/${{ env.RELEASE_ID }}.bundle.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Fail the validation if a reviewed official source drifted
        if: >-
          always() &&
          steps.acquire.outputs.drift == '1' &&
          steps.scope.outputs.code_only != '1'
        shell: bash
        run: |
          echo "An upstream official source no longer matches its reviewed lock." >&2
          echo "The changed payload is preserved under sources/candidates for a" >&2
          echo "named human to review and install." >&2
          echo "Every other gate above ran; this job fails because the drift" >&2
          echo "itself is unreviewed." >&2
          exit 1

      - name: Report unrelated official-source drift
        if: >-
          always() &&
          steps.acquire.outputs.drift == '1' &&
          steps.scope.outputs.code_only == '1'
        shell: bash
        run: |
          echo "::warning::Reviewed official-source bytes changed upstream." >&2
          echo "This dependency or CI-only pull request did not touch source" >&2
          echo "locks, evidence, generated data, or release content, so its" >&2
          echo "code gates remain mergeable. Bundle assembly was not attempted" >&2
          echo "without the reviewed archives. Push validation on main still" >&2
          echo "fails until a named human reviews the quarantined candidates." >&2

