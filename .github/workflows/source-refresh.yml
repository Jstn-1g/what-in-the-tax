name: Refresh official source candidates

# TEMPORARY BYTE FERRY v3 - lives only on the throwaway branch tmp/byte-ferry,
# deleted after use. Captures the upstream Last-Modified headers for the
# re-exported FIR files so the adoption records the server's posted dates
# rather than guesses. Appends to the existing orphan bytes branch.
'on':
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: official-source-refresh
  cancel-in-progress: false

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bytes branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/fir-2025-drift-bytes
      - name: Capture Last-Modified headers
        shell: bash
        run: |
          set -euo pipefail
          for y in 2023 2024 2025; do
            echo "== fir_data_${y}.zip"
            curl -sSI "https://efis.fma.csc.gov.on.ca/fir/MultiYearReport/fir_data_${y}.zip" \
              | tr -d '\r' | grep -iE '^(last-modified|etag|content-length):' || true
          done > headers.txt
          cat headers.txt
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add headers.txt
          git commit -m "Record upstream Last-Modified headers for the FIR re-export (temporary)"
          git push origin HEAD:tmp/fir-2025-drift-bytes
