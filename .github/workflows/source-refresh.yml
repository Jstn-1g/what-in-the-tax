name: Refresh official source candidates

'on':
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch: {}

# Source refresh can fetch public inputs and upload a review artifact. It has no
# repository-write, deployment, package, or OIDC authority.
permissions: {}

concurrency:
  group: official-source-refresh
  cancel-in-progress: false

jobs:
  refresh-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned source-verification dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: -r requirements.txt

      - name: Fetch reviewed sources and preserve changed bytes as candidates
        id: refresh
        shell: bash
        run: |
          set -u -o pipefail
          report_dir="$RUNNER_TEMP/source-refresh"
          mkdir -p "$report_dir"

          set +e
          python scripts/acquire_official_sources.py \
            >"$report_dir/acquisition.json" \
            2>"$report_dir/acquisition.stderr"
          status=$?
          set -e

          # Exit 2 means that a changed upstream payload was safely retained as
          # a candidate. It is a reportable review outcome, not a deployment.
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            echo "Source acquisition failed without a candidate report." >&2
            exit "$status"
          fi
          printf '%s\n' "$status" > "$report_dir/acquisition.exit-code"
          if [[ -d sources/candidates ]]; then
            cp -a sources/candidates "$report_dir/candidates"
          fi

          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- . ':(exclude)sources/candidates')" ]]; then
            git status --short
            echo "Source refresh changed repository content outside candidates." >&2
            exit 1
          fi
          echo "report_dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Upload source refresh candidate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-source-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/source-refresh
          if-no-files-found: warn
          retention-days: 30
