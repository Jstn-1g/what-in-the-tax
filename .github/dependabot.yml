# Watches every dependency surface for updates and advisories. Versions stay
# exact-pinned in the manifests. Verified patch PRs may auto-merge only after
# required branch checks pass; minor and major updates stay under manual review.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
