# Structured forms cover the common cases; blank issues stay available for
# anything they don't fit. Security reports must not become public issues.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/Jstn-1g/what-in-the-tax/security/advisories/new
    about: >-
      Use GitHub's private vulnerability reporting instead of a public issue.
      SECURITY.md describes what to include and what response to expect.
